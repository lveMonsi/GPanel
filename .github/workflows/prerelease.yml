name: Build and Pre-release

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get build info
        id: build_info
        run: |
          # 设置时区为上海
          sudo timedatectl set-timezone Asia/Shanghai
          # 生成构建时间 (使用下划线替代空格，避免 ldflags 解析问题)
          BUILD_TIME=$(date '+%Y-%m-%d_%H:%M:%S_%Z')
          echo "build_time=$BUILD_TIME" >> $GITHUB_OUTPUT
          
          # 获取短 commit hash
          COMMIT_SHORT=$(git rev-parse --short HEAD)
          echo "commit_short=$COMMIT_SHORT" >> $GITHUB_OUTPUT
          
          # 获取完整 commit hash
          COMMIT_FULL=$(git rev-parse HEAD)
          echo "commit_full=$COMMIT_FULL" >> $GITHUB_OUTPUT
          
          # 获取 commit 信息
          COMMIT_MSG=$(git log -1 --pretty=%s)
          echo "commit_msg=$COMMIT_MSG" >> $GITHUB_OUTPUT
          
          # 生成版本号 (使用时间戳)
          VERSION="pre-release-$(date '+%Y%m%d-%H%M%S')"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          
          # 获取最新的正式版标签（排除 pre-release 标签）
          LATEST_RELEASE_TAG=$(git tag -l 'v*' | sort -V | tail -1)
          if [ -z "$LATEST_RELEASE_TAG" ]; then
            # 如果没有正式版标签，使用第一个 commit
            LATEST_RELEASE_TAG=$(git rev-list --max-parents=0 HEAD)
          fi
          echo "latest_release_tag=$LATEST_RELEASE_TAG" >> $GITHUB_OUTPUT
          
          # 生成 compare URL
          COMPARE_URL="https://github.com/${{ github.repository }}/compare/${LATEST_RELEASE_TAG}...${COMMIT_SHORT}"
          echo "compare_url=$COMPARE_URL" >> $GITHUB_OUTPUT
          
          echo "Build Info:"
          echo "  Version: $VERSION"
          echo "  Build Time: $BUILD_TIME"
          echo "  Commit: $COMMIT_SHORT ($COMMIT_MSG)"
          echo "  Latest Release Tag: $LATEST_RELEASE_TAG"

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build frontend
        run: |
          cd frontend
          npm ci
          npm run build:pro
          mkdir -p ../core/routes/web/dist
          cp -r dist/* ../core/routes/web/dist/

      - name: Build Linux amd64
        run: |
          mkdir -p build/linux-amd64
          cd core && CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags "-s -w -X main.Version=${{ steps.build_info.outputs.version }} -X main.BuildTime=${{ steps.build_info.outputs.build_time }} -X main.Commit=${{ steps.build_info.outputs.commit_short }}" -o ../build/linux-amd64/gpanel .
          cd ../agent && CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags "-s -w" -o ../build/linux-amd64/gpanel-agent .
          cd ../tools && CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags "-s -w" -o ../build/linux-amd64/gpctl gpctl.go

      - name: Build Linux arm64
        run: |
          mkdir -p build/linux-arm64
          cd core && CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -ldflags "-s -w -X main.Version=${{ steps.build_info.outputs.version }} -X main.BuildTime=${{ steps.build_info.outputs.build_time }} -X main.Commit=${{ steps.build_info.outputs.commit_short }}" -o ../build/linux-arm64/gpanel .
          cd ../agent && CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -ldflags "-s -w" -o ../build/linux-arm64/gpanel-agent .
          cd ../tools && CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -ldflags "-s -w" -o ../build/linux-arm64/gpctl gpctl.go

      - name: Build Windows amd64
        run: |
          mkdir -p build/windows-amd64
          cd core && CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -ldflags "-s -w -X main.Version=${{ steps.build_info.outputs.version }} -X main.BuildTime=${{ steps.build_info.outputs.build_time }} -X main.Commit=${{ steps.build_info.outputs.commit_short }}" -o ../build/windows-amd64/gpanel.exe .
          cd ../agent && CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -ldflags "-s -w" -o ../build/windows-amd64/gpanel-agent.exe .
          cd ../tools && CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -ldflags "-s -w" -o ../build/windows-amd64/gpctl.exe gpctl.go

      - name: Create archives
        run: |
          cd build
          tar -czvf gpanel-linux-amd64.tar.gz linux-amd64/
          tar -czvf gpanel-linux-arm64.tar.gz linux-arm64/
          cd windows-amd64 && zip -r ../gpanel-windows-amd64.zip .

      - name: Generate checksums
        run: |
          cd build
          sha256sum gpanel-linux-amd64.tar.gz > checksums.txt
          sha256sum gpanel-linux-arm64.tar.gz >> checksums.txt
          sha256sum gpanel-windows-amd64.zip >> checksums.txt

      - name: Find old pre-release
        id: find_old
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 查找旧的 pre-release（排除即将创建的新版本）
          OLD_RELEASE=$(gh release list --repo ${{ github.repository }} --json tagName,isPrerelease --jq '.[] | select(.isPrerelease == true and (.tagName | startswith("pre-release-")) and .tagName != "${{ steps.build_info.outputs.version }}") | .tagName' | head -1)
          
          echo "old_release=$OLD_RELEASE" >> $GITHUB_OUTPUT
          if [ -n "$OLD_RELEASE" ]; then
            echo "Found old pre-release: $OLD_RELEASE"
          else
            echo "No old pre-release found"
          fi

      - name: Create Pre-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 创建 release notes 文件
          cat > /tmp/release_notes.md << 'EOF'
          ## GPanel 预发布版本
          
          > **注意**: 这是一个预发布版本，可能包含未完成的功能、Bug 或不稳定的内容。不建议在生产环境中使用。
          
          ### 构建信息
          
          | 项目 | 内容 |
          | --- | --- |
          | **构建时间** | ${{ steps.build_info.outputs.build_time }} |
          | **Commit** | `${{ steps.build_info.outputs.commit_short }}` |
          | **Commit Hash** | `${{ steps.build_info.outputs.commit_full }}` |
          | **Commit Message** | ${{ steps.build_info.outputs.commit_msg }} |
          
          ### 下载说明
          
          请根据您的系统架构选择对应的压缩包：
          - **Linux x86_64**: `gpanel-linux-amd64.tar.gz`
          - **Linux ARM64**: `gpanel-linux-arm64.tar.gz`
          - **Windows x86_64**: `gpanel-windows-amd64.zip`
          
          ### 安装方式
          
          可以使用管理脚本安装预发布版本：
          ```bash
          curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/master/gpanel.sh | sudo bash -s -- install-pre
          ```
          
          ### 更新日志
          
          查看从上个正式版 `${{ steps.build_info.outputs.latest_release_tag }}` 到当前预发布版本的代码变更：[Compare](${{ steps.build_info.outputs.compare_url }})
          EOF
          
          # 使用 gh release create 创建预发布版本
          gh release create "${{ steps.build_info.outputs.version }}" \
            --repo "${{ github.repository }}" \
            --title "GPanel Pre-release ${{ steps.build_info.outputs.build_time }}" \
            --notes-file /tmp/release_notes.md \
            --prerelease \
            build/gpanel-linux-amd64.tar.gz \
            build/gpanel-linux-arm64.tar.gz \
            build/gpanel-windows-amd64.zip \
            build/checksums.txt

      - name: Delete old pre-release
        if: steps.find_old.outputs.old_release != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Deleting old pre-release: ${{ steps.find_old.outputs.old_release }}"
          gh release delete "${{ steps.find_old.outputs.old_release }}" --repo ${{ github.repository }} --yes --cleanup-tag
