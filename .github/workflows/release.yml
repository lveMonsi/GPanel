name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., v1.0.0)'
        required: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get build info
        id: build_info
        run: |
          # 设置时区为上海
          sudo timedatectl set-timezone Asia/Shanghai
          # 生成构建时间 (使用下划线替代空格，避免 ldflags 解析问题)
          BUILD_TIME=$(date '+%Y-%m-%d_%H:%M:%S_%Z')
          echo "build_time=$BUILD_TIME" >> $GITHUB_OUTPUT
          
          # 获取短 commit hash
          COMMIT_SHORT=$(git rev-parse --short HEAD)
          echo "commit_short=$COMMIT_SHORT" >> $GITHUB_OUTPUT
          
          # 获取完整 commit hash
          COMMIT_FULL=$(git rev-parse HEAD)
          echo "commit_full=$COMMIT_FULL" >> $GITHUB_OUTPUT
          
          # 获取 commit 信息
          COMMIT_MSG=$(git log -1 --pretty=%s)
          echo "commit_msg=$COMMIT_MSG" >> $GITHUB_OUTPUT
          
          # 获取版本号
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          elif [ -n "${{ github.ref_name }}" ]; then
            VERSION="${{ github.ref_name }}"
          else
            VERSION=$(grep -oP 'VERSION=\K.*' .env)
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          
          echo "Build Info:"
          echo "  Version: $VERSION"
          echo "  Build Time: $BUILD_TIME"
          echo "  Commit: $COMMIT_SHORT ($COMMIT_MSG)"

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build frontend
        run: |
          cd frontend
          npm ci
          npm run build:pro
          mkdir -p ../core/routes/web/dist
          cp -r dist/* ../core/routes/web/dist/

      - name: Build Linux amd64
        run: |
          mkdir -p build/linux-amd64
          cd core && CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags "-s -w" -o ../build/linux-amd64/gpanel .
          cd ../agent && CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags "-s -w" -o ../build/linux-amd64/gpanel-agent .
          cd ../tools && CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags "-s -w" -o ../build/linux-amd64/gpctl gpctl.go

      - name: Build Linux arm64
        run: |
          mkdir -p build/linux-arm64
          cd core && CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -ldflags "-s -w" -o ../build/linux-arm64/gpanel .
          cd ../agent && CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -ldflags "-s -w" -o ../build/linux-arm64/gpanel-agent .
          cd ../tools && CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -ldflags "-s -w" -o ../build/linux-arm64/gpctl gpctl.go

      - name: Build Windows amd64
        run: |
          mkdir -p build/windows-amd64
          cd core && CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -ldflags "-s -w" -o ../build/windows-amd64/gpanel.exe .
          cd ../agent && CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -ldflags "-s -w" -o ../build/windows-amd64/gpanel-agent.exe .
          cd ../tools && CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -ldflags "-s -w" -o ../build/windows-amd64/gpctl.exe gpctl.go

      - name: Create archives
        run: |
          cd build
          tar -czvf gpanel-linux-amd64.tar.gz linux-amd64/
          tar -czvf gpanel-linux-arm64.tar.gz linux-arm64/
          cd windows-amd64 && zip -r ../gpanel-windows-amd64.zip .

      - name: Generate checksums
        run: |
          cd build
          sha256sum gpanel-linux-amd64.tar.gz > checksums.txt
          sha256sum gpanel-linux-arm64.tar.gz >> checksums.txt
          sha256sum gpanel-windows-amd64.zip >> checksums.txt

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.build_info.outputs.version }}
          name: GPanel ${{ steps.build_info.outputs.version }}
          body: |
            ## GPanel 正式版
            
            ### 构建信息
            
            | 项目 | 内容 |
            | --- | --- |
            | **版本号** | ${{ steps.build_info.outputs.version }} |
            | **构建时间** | ${{ steps.build_info.outputs.build_time }} |
            | **Commit** | `${{ steps.build_info.outputs.commit_short }}` |
            | **Commit Hash** | `${{ steps.build_info.outputs.commit_full }}` |
            | **Commit Message** | ${{ steps.build_info.outputs.commit_msg }} |
            
            ### 下载说明
            
            请根据您的系统架构选择对应的压缩包：
            - **Linux x86_64**: `gpanel-linux-amd64.tar.gz`
            - **Linux ARM64**: `gpanel-linux-arm64.tar.gz`
            - **Windows x86_64**: `gpanel-windows-amd64.zip`
            
            ### 安装方式
            
            #### 使用安装脚本（推荐）
            
            ```bash
            curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/master/gpanel.sh | sudo bash -s -- install ${{ steps.build_info.outputs.version }}
            ```
            
            #### 国内镜像安装（加速）
            
            ```bash
            curl -fsSL https://gh.llkk.cc/https://raw.githubusercontent.com/${{ github.repository }}/master/gpanel.sh | sudo bash -s -- install ${{ steps.build_info.outputs.version }}
            ```
            
            #### 手动安装
            
            1. 下载对应平台的压缩包
            2. 解压到目标目录
            3. 运行 `gpanel-agent` 和 `gpanel`
            
            ### 更新日志
            
            <!-- 自动生成的更新日志将在下方显示 -->
          files: |
            build/gpanel-linux-amd64.tar.gz
            build/gpanel-linux-arm64.tar.gz
            build/gpanel-windows-amd64.zip
            build/checksums.txt
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.workflow_token }}
