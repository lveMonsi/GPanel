<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <link rel="icon" href="/favicon.ico">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GPanel</title>
    <!-- DNS 预解析 -->
    <link rel="dns-prefetch" href="//localhost">
    <!-- 预连接 -->
    <link rel="preconnect" href="//localhost">
  </head>
  <body>
    <div id="app">
      <!-- 加载动画 -->
      <style>
        .app-loading {
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          height: 100vh;
          background: linear-gradient(135deg, #a8d8ea 0%, #7cc9e0 50%, #5ab8d6 100%);
        }
        .app-loading-logo {
          width: 64px;
          height: 64px;
          background: linear-gradient(135deg, #7cc9e0 0%, #5ab8d6 100%);
          border-radius: 8px;
          display: flex;
          align-items: center;
          justify-content: center;
          font-size: 2rem;
          font-weight: 700;
          color: white;
          box-shadow: 0 4px 16px rgba(0, 0, 0, 0.15);
          margin-bottom: 24px;
          animation: pulse 1.5s ease-in-out infinite;
        }
        .app-loading-text {
          color: white;
          font-size: 16px;
          font-weight: 500;
          opacity: 0.9;
        }
        @keyframes pulse {
          0%, 100% { transform: scale(1); opacity: 1; }
          50% { transform: scale(1.05); opacity: 0.8; }
        }
      </style>
      <div class="app-loading">
        <div class="app-loading-logo">G</div>
        <div class="app-loading-text">加载中...</div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
